# PostgreSQL OPCIONAL para o perfil "postgres" (credenciais fictícias, somente uso local).
# Subir:  docker compose up -d
# Rodar:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barberagenda
      POSTGRES_USER: barberagenda
      POSTGRES_PASSWORD: barberagenda
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
