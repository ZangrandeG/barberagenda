# Perfil test: banco H2 em memória, recriado a cada inicialização.
# Usado pelos testes automatizados e para subir a aplicação no pipeline (Newman/Selenium).
spring.datasource.url=jdbc:h2:mem:barberagenda;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
