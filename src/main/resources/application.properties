# BarberAgenda - configuração comum a todos os perfis
spring.application.name=barberagenda

# Sem perfil informado, a aplicação sobe no perfil de desenvolvimento (H2 em arquivo)
spring.profiles.default=dev

server.port=${PORTA:8080}
spring.jpa.open-in-view=false

# Erros nunca expõem stack trace ou detalhes internos (segurança básica)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Fuso horário usado nas regras de agendamento
barberagenda.fuso-horario=America/Sao_Paulo

# Administrador inicial - CREDENCIAL FICTÍCIA para desenvolvimento e testes.
# Em outro ambiente, defina as variáveis ADMIN_LOGIN e ADMIN_SENHA.
barberagenda.admin.login=${ADMIN_LOGIN:admin}
barberagenda.admin.senha=${ADMIN_SENHA:admin123}
