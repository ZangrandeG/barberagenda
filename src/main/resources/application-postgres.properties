# Perfil postgres (OPCIONAL): PostgreSQL local, por exemplo via docker-compose.yml.
# Combine com o perfil dev para carregar a massa fictícia: --spring.profiles.active=dev,postgres
# Os valores padrão abaixo são FICTÍCIOS e servem apenas para o contêiner local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barberagenda}
spring.datasource.username=${DB_USUARIO:barberagenda}
spring.datasource.password=${DB_SENHA:barberagenda}
spring.jpa.hibernate.ddl-auto=update
